<head>
    <title>Pomegranate - Pseudocode</title>
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <script type="text/javascript" src="/extras/tln.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/extras/tln.min.css"/>
    <meta charset="UTF-8">
</head>
<body>
    <header>
        <h1>Pseudocode!</h1>
    </header>
    <div id="main">
        <div id="wrapper">
            <textarea id="pcode" oninput="rmEval()"></textarea>
        </div>
        <section id="results">
            <button id="evalbtn" onclick="runCode()">Run code!</button>
            <div id="logs"></div>
            <textarea id="pynput" rows="9" wrap="off" disabled></textarea>
        </section>
    </div>
    <footer id="results">
        <details>
            <summary>Reference</summary>
            <div id="ref">
                <aside>
                    <button onclick="setRefFilter('all', this)" class="refbtnsel">All</button>
                    <button onclick="setRefFilter('basic', this)">Basic</button>
                    <button onclick="setRefFilter('sel', this)">Selection</button>
                    <button onclick="setRefFilter('rep', this)">Repetition</button>
                    <button onclick="setRefFilter('subr', this)">Subroutines</button>
                </aside>
                <div id="refconts" class="all"></div>
                <textarea id="reftxt" wrap="off" disabled></textarea>
            </div>
        </details>
    </footer>
</body>
